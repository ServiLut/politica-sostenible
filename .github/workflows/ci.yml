name: Verificación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: politica_sostenible_test
          POSTGRES_USER: politica_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U politica_test -d politica_sostenible_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditar dependencias de produccion
        run: pnpm audit --prod --audit-level high
      - name: Probar guard de migraciones del contenedor Dokploy
        run: pnpm test:deploy
      - name: Bloquear deepmerge-ts vulnerable en la resolución de Prisma
        shell: bash
        run: |
          pnpm list deepmerge-ts -r --depth 20 --json > "$RUNNER_TEMP/deepmerge-tree.json"
          node -e 'const fs = require("node:fs"); const tree = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const versions = []; const walk = (value) => { if (!value || typeof value !== "object") return; if (value.from === "deepmerge-ts" && typeof value.version === "string") versions.push(value.version); for (const child of Object.values(value)) walk(child); }; walk(tree); const unsafe = versions.some((version) => { const major = Number.parseInt(version, 10); return !Number.isInteger(major) || major < 8; }); if (versions.length === 0 || unsafe) { console.error(`Resolución insegura de deepmerge-ts: ${versions.join(", ") || "ausente"}`); process.exit(1); } console.log(`deepmerge-ts mitigado: ${[...new Set(versions)].join(", ")}`);' "$RUNNER_TEMP/deepmerge-tree.json"
      - run: pnpm --filter api generate
      - name: Aplicar migraciones en PostgreSQL vacío
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DIRECT_URL: postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_test?schema=public
      - name: Verificar historial y deriva del esquema
        run: |
          pnpm --filter api exec prisma migrate status
          pnpm --filter api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DIRECT_URL: postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_test?schema=public
      - name: Ensayar adopción de baseline con las cinco migraciones históricas
        shell: bash
        env:
          PGPASSWORD: local_ci_only
          LEGACY_DIRECT_URL: postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_legacy?schema=public
        run: |
          psql -h localhost -U politica_test -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE politica_sostenible_legacy'
          psql -h localhost -U politica_test -d politica_sostenible_legacy \
            -v ON_ERROR_STOP=1 \
            -f apps/api/prisma/migrations/20260827000000_baseline/migration.sql
          DIRECT_URL="$LEGACY_DIRECT_URL" pnpm --filter api exec prisma migrate resolve \
            --applied 20260827000000_baseline
          psql -h localhost -U politica_test -d politica_sostenible_legacy -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "_prisma_migrations"
            (id, checksum, finished_at, migration_name, logs, rolled_back_at, started_at, applied_steps_count)
          SELECT
            md5(name), repeat('0', 64), now(), name, NULL, NULL, now(), 1
          FROM unnest(ARRAY[
            '20260821123000_issue_case_mode_reference',
            '20260821140000_consent_revocation_reason',
            '20260821160000_team_invitations',
            '20260821170000_campaign_events',
            '20260821180000_user_account_lifecycle'
          ]) AS name;
          DELETE FROM "_prisma_migrations"
          WHERE migration_name = '20260827000000_baseline';
          SQL
          legacy_state="$(psql -h localhost -U politica_test -d politica_sostenible_legacy -At -v ON_ERROR_STOP=1 <<'SQL'
          WITH expected(name) AS (
            VALUES
              ('20260821123000_issue_case_mode_reference'),
              ('20260821140000_consent_revocation_reason'),
              ('20260821160000_team_invitations'),
              ('20260821170000_campaign_events'),
              ('20260821180000_user_account_lifecycle')
          ), observed AS (
            SELECT migration_name, finished_at, rolled_back_at, applied_steps_count
            FROM "_prisma_migrations"
          )
          SELECT CASE
            WHEN (SELECT count(*) FROM observed) = 5
             AND NOT EXISTS (
               SELECT 1
               FROM expected e
               LEFT JOIN observed o ON o.migration_name = e.name
               WHERE o.migration_name IS NULL
                  OR o.finished_at IS NULL
                  OR o.rolled_back_at IS NOT NULL
                  OR o.applied_steps_count < 1
             )
            THEN 'READY'
            ELSE 'STOP'
          END;
          SQL
          )"
          test "$legacy_state" = "READY"
          DIRECT_URL="$LEGACY_DIRECT_URL" pnpm --filter api exec prisma migrate diff \
            --from-config-datasource --to-schema prisma/baseline.schema.prisma --exit-code
          NODE_ENV=production \
          DEPLOYMENT_PROFILE=evaluation \
          ALLOW_INSECURE_DATABASE_CONNECTION=true \
          DATABASE_SSL=false \
          DATABASE_SSL_REJECT_UNAUTHORIZED=false \
          DATABASE_URL="$LEGACY_DIRECT_URL&sslmode=disable" \
          DIRECT_URL="$LEGACY_DIRECT_URL&sslmode=disable" \
            node deploy/migrate-entrypoint.mjs
          DIRECT_URL="$LEGACY_DIRECT_URL" pnpm --filter api exec prisma migrate status
          DIRECT_URL="$LEGACY_DIRECT_URL" pnpm --filter api exec prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          historical_rows="$(psql -h localhost -U politica_test -d politica_sostenible_legacy -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*)
          FROM "_prisma_migrations"
          WHERE migration_name IN (
            '20260821123000_issue_case_mode_reference',
            '20260821140000_consent_revocation_reason',
            '20260821160000_team_invitations',
            '20260821170000_campaign_events',
            '20260821180000_user_account_lifecycle'
          )
            AND finished_at IS NOT NULL
            AND rolled_back_at IS NULL
            AND applied_steps_count >= 1;
          SQL
          )"
          test "$historical_rows" = "5"
      - name: Probar Prisma contra PostgreSQL real
        run: pnpm --filter api test:integration
        env:
          DIRECT_URL: postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_test?schema=public
          TEST_DATABASE_URL: postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_test?schema=public
      - run: pnpm --filter api test --runInBand
      - run: pnpm --filter api exec tsc -p tsconfig.build.json --noEmit --incremental false
      - run: pnpm test:web-unit
      - run: pnpm build
      - name: Verificar Prisma CLI en la imagen combinada de Dokploy
        env:
          PGPASSWORD: local_ci_only
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=https://politica-ci.invalid \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://storage-ci.invalid \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-anon-key-not-a-real-token \
            --tag politica-sostenible-ci .
          docker run --rm --entrypoint node politica-sostenible-ci apps/api/node_modules/prisma/build/index.js --version
          docker run --rm --entrypoint node politica-sostenible-ci --check deploy/migrate.mjs
          psql -h localhost -U politica_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE politica_sostenible_dokploy'
          docker run --rm --network host \
            --env 'DIRECT_URL=postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_dokploy?sslmode=disable&schema=politica-sostenible' \
            --env 'DATABASE_URL=postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_dokploy?sslmode=disable&schema=politica-sostenible' \
            --env DEPLOYMENT_PROFILE=evaluation \
            --env ALLOW_INSECURE_DATABASE_CONNECTION=true \
            --env DATABASE_SSL=false \
            --env DATABASE_SSL_REJECT_UNAUTHORIZED=false \
            --entrypoint node politica-sostenible-ci \
            --input-type=module --eval "import('./deploy/migrate.mjs').then(({ runSafeMigrations }) => runSafeMigrations())"
          table_count="$(psql -h localhost -U politica_test -d politica_sostenible_dokploy -At -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_tables WHERE schemaname = 'politica-sostenible'")"
          test "$table_count" -gt 0
          docker run --detach --name politica-sostenible-ci-runtime --network host \
            --env 'DIRECT_URL=postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_dokploy?sslmode=disable&schema=politica-sostenible' \
            --env 'DATABASE_URL=postgresql://politica_test:local_ci_only@localhost:5432/politica_sostenible_dokploy?sslmode=disable&schema=politica-sostenible' \
            --env DEPLOYMENT_PROFILE=evaluation \
            --env ALLOW_INSECURE_DATABASE_CONNECTION=true \
            --env DATABASE_SSL=false \
            --env DATABASE_SSL_REJECT_UNAUTHORIZED=false \
            --env JWT_SECRET=ci-jwt-secret-with-more-than-thirty-two-bytes \
            --env CONSENT_IP_SALT=ci-consent-salt-with-more-than-thirty-two-bytes \
            --env CORS_ORIGINS=https://politica-ci.invalid \
            --env NEXT_PUBLIC_APP_URL=https://politica-ci.invalid \
            --env SUPABASE_URL=https://storage-ci.invalid \
            --env SUPABASE_SERVICE_ROLE_KEY=sb_secret_ci_only_not_a_real_key \
            --env SUPABASE_STORAGE_BUCKET=politica-ci \
            politica-sostenible-ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs politica-sostenible-ci-runtime
            docker rm --force politica-sostenible-ci-runtime
            exit 1
          fi
          docker rm --force politica-sostenible-ci-runtime
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
