<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Política Sostenible</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #94a3b8;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        background: #059669;
        color: white;
        border-radius: 0.5rem;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
      }
      .notice {
        max-width: 34rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sin conexión a internet</h1>
      <p class="notice">
        Esta página no contiene datos de campaña. Ninguna operación se marcará
        como recibida por el servidor mientras no haya conexión.
      </p>
      <a href="/aplicacion">Abrir aplicación sin conexión</a>
    </div>
  </body>
</html>
